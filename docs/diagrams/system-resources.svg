<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">资源关系与轨迹内部结构</title><desc id="desc">集合与 Case 组织运行，运行可有多个不可变版本。每个版本记录轮次、模型请求、工具调用和关联。固定选集绑定版本，Invocation 使用固定输入并生成独立业务产物。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#69757b"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#232b30;font-size:14px}.small{font-size:12px;fill:#677279}.title{font-weight:600;font-size:16px}.label{font-size:12px;fill:#4f616c}.note{font-size:12px;fill:#52646d}.future{stroke-dasharray:6 4}</style>
<rect width="1000" height="650" fill="white"/>
<rect x="30" y="28" width="270" height="66" rx="3" fill="#f8fafb" stroke="#bac5cb" class=""/>
<text x="165.0" y="55" class="title" text-anchor="middle">Collection / Case</text>
<text x="165.0" y="77" class="small" text-anchor="middle">组织关系 · 不改变轨迹原文</text>
<rect x="365" y="28" width="270" height="66" rx="3" fill="#f8fafb" stroke="#bac5cb" class=""/>
<text x="500.0" y="55" class="title" text-anchor="middle">Run</text>
<text x="500.0" y="77" class="small" text-anchor="middle">一次执行；重跑产生新 Run</text>
<rect x="700" y="28" width="270" height="66" rx="3" fill="#f8fafb" stroke="#bac5cb" class=""/>
<text x="835.0" y="55" class="title" text-anchor="middle">Trace Revision</text>
<text x="835.0" y="77" class="small" text-anchor="middle">补采 / 修复产生新版本</text>
<path d="M300,61 L365,61" fill="none" stroke="#74818a" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M635,61 L700,61" fill="none" stroke="#74818a" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M835,94 L835,134 L500,134 L500,170" fill="none" stroke="#74818a" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="170" y="170" width="660" height="242" rx="3" fill="#fafbfc" stroke="#bac5cb" class=""/>
<text x="500.0" y="197" class="title" text-anchor="middle">版本内的记录与关系</text>
<text x="203" y="225" class="title" text-anchor="start">用户轮次 01  /  Query + 本轮响应</text>
<text x="238" y="264" class="" text-anchor="start">模型请求 A  →  响应 / 工具调用提议</text>
<text x="275" y="302" class="" text-anchor="start">工具执行 1 / 2  →  结果观察</text>
<text x="238" y="340" class="" text-anchor="start">模型请求 B  →  最终回复</text>
<text x="203" y="382" class="title" text-anchor="start">用户轮次 02  /  追加要求 …</text>
<path d="M218,237 L218,337 L229,337" fill="none" stroke="#74818a" stroke-width="1.3"/>
<path d="M255,275 L255,298 L266,298" fill="none" stroke="#74818a" stroke-width="1.3"/>
<path d="M830,264 L914,264 L914,375 L830,375" fill="none" stroke="#74818a" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="843" y="331" class="label" text-anchor="start">来源 / 因果关联</text>
<path d="M500,412 L500,439 L165,439 L165,463" fill="none" stroke="#74818a" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="220" y="431" class="label" text-anchor="start">固定成员引用</text>
<path d="M605,412 L605,463" fill="none" stroke="#74818a" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="616" y="451" class="label" text-anchor="start">也可直接引用</text>
<rect x="30" y="463" width="270" height="78" rx="3" fill="#f8fafb" stroke="#bac5cb" class=""/>
<text x="165.0" y="490" class="title" text-anchor="middle">Selection Snapshot</text>
<text x="165.0" y="512" class="small" text-anchor="middle">固定 Run + Revision + Digest</text>
<rect x="365" y="463" width="270" height="78" rx="3" fill="#f8fafb" stroke="#bac5cb" class=""/>
<text x="500.0" y="490" class="title" text-anchor="middle">Invocation / Attempt</text>
<text x="500.0" y="512" class="small" text-anchor="middle">操作版本 · 配置 · 本次执行</text>
<rect x="700" y="463" width="270" height="78" rx="3" fill="#f8fafb" stroke="#bac5cb" class=""/>
<text x="835.0" y="490" class="title" text-anchor="middle">Artifact</text>
<text x="835.0" y="512" class="small" text-anchor="middle">分类 / 分数 / 报告 / 验收</text>
<path d="M300,502 L365,502" fill="none" stroke="#74818a" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M635,502 L700,502" fill="none" stroke="#74818a" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M834,541 L834,581 L166,581 L166,541" fill="none" stroke="#74818a" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="348" y="571" class="label" text-anchor="start">产物保留固定输入和生成者来源</text>
<rect x="30" y="603" width="940" height="30" fill="#eef3f5"/>
<text x="40" y="623" class="note" text-anchor="start">树用于阅读；并行、重试、共享结果和子 Agent 依赖使用显式关联，不能只靠时间顺序猜。</text>
</svg>
