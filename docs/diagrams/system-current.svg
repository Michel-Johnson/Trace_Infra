<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 710" role="img" aria-labelledby="title desc"><title id="title">当前部署架构</title><desc id="desc">Web、采集器和远程 Agent 经 Caddy 进入 FastAPI。API 与两个官方 Worker 复用 Python 核心。PostgreSQL 保存登记、索引、任务和产物，持久内容目录保存正文。远程 Agent 通过 API，不直接连接数据库。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#69757b"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#232b30;font-size:14px}.small{font-size:12px;fill:#677279}.title{font-weight:600;font-size:16px}.label{font-size:12px;fill:#4f616c}.note{font-size:12px;fill:#52646d}.future{stroke-dasharray:6 4}</style>
<rect width="1000" height="710" fill="white"/>
<rect x="40" y="25" width="270" height="72" rx="3" fill="#f8fafb" stroke="#bac5cb" class=""/>
<text x="175.0" y="52" class="title" text-anchor="middle">Web / UI 插件</text>
<text x="175.0" y="74" class="small" text-anchor="middle">React · 浏览与显式分析</text>
<rect x="365" y="25" width="270" height="72" rx="3" fill="#f8fafb" stroke="#bac5cb" class=""/>
<text x="500.0" y="52" class="title" text-anchor="middle">采集器 / CLI / Skill</text>
<text x="500.0" y="74" class="small" text-anchor="middle">标准 JSON · 保留来源</text>
<rect x="690" y="25" width="270" height="72" rx="3" fill="#f8fafb" stroke="#bac5cb" class=""/>
<text x="825.0" y="52" class="title" text-anchor="middle">远程 Agent / 服务</text>
<text x="825.0" y="74" class="small" text-anchor="middle">查询凭据 · 任务凭据</text>
<path d="M175,97 L175,128 L500,128" fill="none" stroke="#74818a" stroke-width="1.3"/>
<path d="M500,97 L500,128 L500,128" fill="none" stroke="#74818a" stroke-width="1.3"/>
<path d="M825,97 L825,128 L500,128" fill="none" stroke="#74818a" stroke-width="1.3"/>
<path d="M500,128 L500,157" fill="none" stroke="#74818a" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="180" y="157" width="640" height="72" rx="3" fill="#f8fafb" stroke="#bac5cb" class=""/>
<text x="500.0" y="184" class="title" text-anchor="middle">同源入口 · Caddy</text>
<text x="500.0" y="206" class="small" text-anchor="middle">网页登录 / 项目与任务 Bearer 转发；权限由 API 再校验</text>
<path d="M500,229 L500,263" fill="none" stroke="#74818a" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="150" y="263" width="700" height="160" rx="3" fill="#f7f9fa" stroke="#bac5cb" class=""/>
<text x="500.0" y="290" class="title" text-anchor="middle">API 进程 · FastAPI</text>
<text x="500.0" y="312" class="small" text-anchor="middle">路由、鉴权、限额、错误映射</text>
<rect x="180" y="338" width="640" height="61" rx="3" fill="#fff" stroke="#bac5cb" class=""/>
<text x="500.0" y="365" class="title" text-anchor="middle">Backend · 共享 Python 应用服务</text>
<text x="500.0" y="387" class="small" text-anchor="middle">版本 / 查询 / 选集 / 产物 / Invocation / 授权</text>
<path d="M275,423 L275,464" fill="none" stroke="#74818a" stroke-width="1.3"/>
<text x="75" y="449" class="label" text-anchor="start">独立进程，共享核心</text>
<path d="M535,423 L535,464" fill="none" stroke="#74818a" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="548" y="450" class="label" text-anchor="start">事务与查询</text>
<path d="M765,423 L765,464" fill="none" stroke="#74818a" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="778" y="450" class="label" text-anchor="start">正文读写</text>
<rect x="40" y="464" width="320" height="112" rx="3" fill="#f8fafb" stroke="#bac5cb" class=""/>
<text x="200.0" y="491" class="title" text-anchor="middle">两个官方 Worker</text>
<text x="200.0" y="513" class="small" text-anchor="middle">旧分类 / 评测 Worker</text>
<text x="200.0" y="533" class="small" text-anchor="middle">中性 Invocation Worker</text>
<text x="200.0" y="553" class="small" text-anchor="middle">领取任务 → 执行 → 提交结果</text>
<rect x="420" y="464" width="230" height="112" rx="3" fill="#f8fafb" stroke="#bac5cb" class=""/>
<text x="535.0" y="491" class="title" text-anchor="middle">PostgreSQL</text>
<text x="535.0" y="513" class="small" text-anchor="middle">版本、元数据与索引</text>
<text x="535.0" y="533" class="small" text-anchor="middle">固定选集、租约、产物来源</text>
<text x="535.0" y="553" class="small" text-anchor="middle">同库持久任务</text>
<rect x="705" y="464" width="255" height="112" rx="3" fill="#f8fafb" stroke="#bac5cb" class=""/>
<text x="832.5" y="491" class="title" text-anchor="middle">持久内容目录</text>
<text x="832.5" y="513" class="small" text-anchor="middle">LocalContentStore</text>
<text x="832.5" y="533" class="small" text-anchor="middle">原始 JSON / 产物正文</text>
<text x="832.5" y="553" class="small" text-anchor="middle">按 SHA-256 校验</text>
<path d="M360,510 L420,510" fill="none" stroke="#74818a" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M200,576 L200,608 L835,608 L835,576" fill="none" stroke="#74818a" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="455" y="598" class="label" text-anchor="middle">Worker 读写内容存储</text>
<rect x="40" y="634" width="920" height="30" fill="#eef3f5"/>
<text x="50" y="654" class="note" text-anchor="start">当前单机 systemd 部署；容器角色已经拆分，Compose 仍需补齐 Invocation Worker。</text>
</svg>
