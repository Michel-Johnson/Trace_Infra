<text x="662.5" y="52" class="title" text-anchor="middle">协议与服务身份</text>
<text x="662.5" y="74" class="small" text-anchor="middle">能力发现 · 精确版本引用 · 项目与任务授权</text>
<path d="M315,61 L360,61" fill="none" stroke="#74818a" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M660,97 L660,138" fill="none" stroke="#74818a" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="35" y="138" width="930" height="110" rx="3" fill="#edf3f6" stroke="#bac5cb" class=""/>
<text x="500.0" y="165" class="title" text-anchor="middle">中性平台核心</text>
<text x="500.0" y="187" class="small" text-anchor="middle">记录与修订 · 内容存储 · 有界查询 · 固定选集</text>
<text x="500.0" y="207" class="small" text-anchor="middle">Invocation / Attempt · Typed Artifact · 证据与来源</text>
<path d="M160,248 L160,295" fill="none" stroke="#74818a" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M500,248 L500,295" fill="none" stroke="#74818a" stroke-width="1.3" marker-end="url(#arrow)"/>
