<text x="500.0" y="605" class="small" text-anchor="middle">S3 对象提供方 / 存储分块 / 分析读库：达到实测门槛后引入</text>
<path d="M35,220 L17,220 L17,593 L35,593" fill="none" stroke="#74818a" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="35" y="649" class="small" text-anchor="start">实线：已有核心或接入能力；虚线：待建设能力。图中方框是职责，不要求一框一个微服务。</text>
</svg>
