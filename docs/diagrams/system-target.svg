<rect x="35" y="295" width="255" height="95" rx="3" fill="#f8fafb" stroke="#bac5cb" class=""/>
<text x="162.5" y="322" class="title" text-anchor="middle">业务插件</text>
<text x="162.5" y="344" class="small" text-anchor="middle">Base 阶段 / 成本 / 质量</text>
<text x="162.5" y="364" class="small" text-anchor="middle">分类、评分、统计、渲染</text>
<rect x="360" y="295" width="280" height="95" rx="3" fill="#f8fafb" stroke="#bac5cb" class=""/>
<text x="500.0" y="322" class="title" text-anchor="middle">远程 Runtime</text>
<text x="500.0" y="344" class="small" text-anchor="middle">服务握手与任务委派</text>
<text x="500.0" y="364" class="small" text-anchor="middle">业务代码、模型、Agent</text>
<rect x="710" y="295" width="255" height="95" rx="3" fill="#f8fafb" stroke="#bac5cb" class="future"/>
<text x="837.5" y="322" class="title" text-anchor="middle">回放与验证</text>
<text x="837.5" y="344" class="small" text-anchor="middle">初态恢复 / 重执行</text>
<text x="837.5" y="364" class="small" text-anchor="middle">新轨迹 / 独立验收</text>
<path d="M965,222 L983,222 L983,477 L730,477" fill="none" stroke="#74818a" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
