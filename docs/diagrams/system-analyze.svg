<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 881" role="img" aria-labelledby="title desc"><title id="title">时序：查询、固定输入与远程插件</title><desc id="desc">Agent 先查询固定选集，再由调度方创建任务、固定操作和运行时并委派执行凭据。远端读取输入、续租、提交结果，平台在事务内发布结果、产物和血缘。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#69757b"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#232b30;font-size:14px}.small{font-size:12px;fill:#677279}.title{font-weight:600;font-size:16px}.label{font-size:12px;fill:#4f616c}.note{font-size:12px;fill:#52646d}.future{stroke-dasharray:6 4}</style>
<rect width="1000" height="881" fill="white"/>
<rect x="7.0" y="20" width="146" height="63" rx="3" fill="#f8fafb" stroke="#bac5cb" class=""/>
<text x="80.0" y="47" class="title" text-anchor="middle">人 / 查询 Agent</text>
<text x="80.0" y="69" class="small" text-anchor="middle">读取或显式计算</text>
<path d="M80.0,83 L80.0,846" fill="none" stroke="#74818a" stroke-width="1.3" stroke-dasharray="5 4"/>
<rect x="287.0" y="20" width="146" height="63" rx="3" fill="#f8fafb" stroke="#bac5cb" class=""/>
<text x="360.0" y="47" class="title" text-anchor="middle">API / 核心</text>
<text x="360.0" y="69" class="small" text-anchor="middle">权限与执行合同</text>
<path d="M360.0,83 L360.0,846" fill="none" stroke="#74818a" stroke-width="1.3" stroke-dasharray="5 4"/>
<rect x="567.0" y="20" width="146" height="63" rx="3" fill="#f8fafb" stroke="#bac5cb" class=""/>
<text x="640.0" y="47" class="title" text-anchor="middle">PostgreSQL</text>
<text x="640.0" y="69" class="small" text-anchor="middle">选集 / 租约 / 产物</text>
<path d="M640.0,83 L640.0,846" fill="none" stroke="#74818a" stroke-width="1.3" stroke-dasharray="5 4"/>
<rect x="847.0" y="20" width="146" height="63" rx="3" fill="#f8fafb" stroke="#bac5cb" class=""/>
<text x="920.0" y="47" class="title" text-anchor="middle">调度方 / 远程 Agent</text>
<text x="920.0" y="69" class="small" text-anchor="middle">授权后执行插件</text>
<path d="M920.0,83 L920.0,846" fill="none" stroke="#74818a" stroke-width="1.3" stroke-dasharray="5 4"/>
<path d="M80.0,138 L360.0,138" fill="none" stroke="#74818a" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="220.0" y="124" class="label" text-anchor="middle">1. 查询 / 聚合 / 读取已有分析</text>
<path d="M360.0,198 L80.0,198" fill="none" stroke="#74818a" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="220.0" y="184" class="label" text-anchor="middle">2. 返回分页数据、覆盖情况和引用</text>
<path d="M80.0,258 L360.0,258" fill="none" stroke="#74818a" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="220.0" y="244" class="label" text-anchor="middle">3. 显式创建 Selection + Invocation</text>
<path d="M360.0,318 L640.0,318" fill="none" stroke="#74818a" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="500.0" y="304" class="label" text-anchor="middle">4. 固定输入版本、操作与配置</text>
<path d="M920.0,378 L360.0,378" fill="none" stroke="#74818a" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="640.0" y="364" class="label" text-anchor="middle">5. 授权调度者领取；按需发放任务凭据</text>
<path d="M360.0,438 L920.0,438" fill="none" stroke="#74818a" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="640.0" y="424" class="label" text-anchor="middle">6. attempt / 租约 / 绑定输入</text>
<path d="M920.0,498 L360.0,498" fill="none" stroke="#74818a" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="640.0" y="484" class="label" text-anchor="middle">7. 读取固定输入；执行期间 heartbeat</text>
<path d="M920.0,558 L360.0,558" fill="none" stroke="#74818a" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="640.0" y="544" class="label" text-anchor="middle">8. complete：输出角色与内容</text>
<path d="M360.0,618 L640.0,618" fill="none" stroke="#74818a" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="500.0" y="604" class="label" text-anchor="middle">9. 正文先存；SQL 事务登记结果、产物引用与来源</text>
<path d="M360.0,678 L920.0,678" fill="none" stroke="#74818a" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="640.0" y="664" class="label" text-anchor="middle">10. 固定回执；相同结果重传返回原回执</text>
<path d="M80.0,738 L360.0,738" fill="none" stroke="#74818a" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="220.0" y="724" class="label" text-anchor="middle">11. 读取 Artifact；按需创建下一次 Invocation</text>
<rect x="25" y="777" width="950" height="30" fill="#eef3f5"/>
<text x="35" y="797" class="note" text-anchor="start">远程 Runtime 先登记和探测，再委派；官方 Worker 直接调用进程内核心，复用相同执行生命周期。</text>
<rect x="25" y="815" width="950" height="30" fill="#eef3f5"/>
<text x="35" y="835" class="note" text-anchor="start">服务身份与任务凭据权限不同。租约只控制提交资格，不证明外部动作已经停止或只执行一次。</text>
</svg>
